[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-mcp"
version = "0.2.0"
description = "General-purpose MCP stdio server for Autodesk Maya"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp==1.30.0", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
maya-mcp = "maya_mcp.server:main"

[tool.setuptools.packages.find]
include = ["maya_mcp*"]
