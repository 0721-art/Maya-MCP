[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maya-mcp"
version = "0.1.0"
description = "MCP stdio modeling tools for Maya 2026"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0", "Pillow>=10,<13"]

[project.scripts]
maya-mcp = "maya_mcp.server:main"

[tool.setuptools.packages.find]
include = ["maya_mcp*"]
